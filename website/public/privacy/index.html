<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Policy — GutWell AI</title>
<!--
  ROUTE SCAFFOLD — NOT THE PRIVACY POLICY.

  This file exists so that /privacy resolves and can later host the approved
  policy without any infrastructure change. It deliberately contains NO legal
  wording.

  The drafted policy in legal/privacy.html still carries 36 unresolved
  [PLACEHOLDER] markers (operator legal name, service address, contact email,
  DPO determination, Impressum). Publishing that text here would present an
  incomplete document as final, so it has not been copied in.

  TO PUBLISH: replace this file's <body> with the approved policy, remove the
  noindex directive below, and add the URL to sitemap.xml.

  DO NOT enter this URL in App Store Connect until that has happened.
-->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1F14">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green-900:#0B1F14;
  --green-400:#52B788;
  --green-300:#74C69D;
  --text-secondary:rgba(255,255,255,0.65);
  --text-tertiary:rgba(255,255,255,0.55);
  --card-bg:rgba(255,255,255,0.05);
  --card-border:rgba(255,255,255,0.09);
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
}
body{font-family:var(--font-sans);background:var(--green-900);color:#fff;-webkit-font-smoothing:antialiased;line-height:1.6;
     display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
a{color:var(--green-300)}
a:focus-visible{outline:2px solid var(--green-400);outline-offset:3px;border-radius:4px}
.card{max-width:560px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:32px}
h1{font-size:26px;margin-bottom:12px}
p{color:var(--text-secondary);margin-bottom:12px}
.muted{color:var(--text-tertiary);font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:16px;margin-top:20px}
.links a{font-size:14px;text-decoration:none;color:var(--text-secondary)}
.links a:hover{color:#fff}
@media(max-width:768px){.card{padding:24px}h1{font-size:22px}}
</style>
</head>
<body>
  <div class="card">
    <h1>Privacy Policy</h1>
    <p>
      The GutWell AI privacy policy is being finalised ahead of the App Store
      release and is not yet published at this address.
    </p>
    <p class="muted">
      For any privacy question in the meantime, including a request to access or
      delete your data, email
      <a href="mailto:support@getgutwell.app?subject=Privacy%20question">support@getgutwell.app</a>.
    </p>
    <div class="links">
      <a href="/">Home</a>
      <a href="/support">Support</a>
    </div>
  </div>
</body>
</html>
