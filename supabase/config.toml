[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://getgutwell.app"

# Password recovery returns the user to the app through the custom scheme
# registered in app.json and ios/GutWell/Info.plist (CFBundleURLSchemes).
#
# Both slash forms are listed deliberately. The app builds the redirect with
# expo-linking's Linking.createURL('/reset-password'). In a release build that
# resolves to gutwellapp:///reset-password (three slashes) — createURL appends a
# leading slash to an empty hostUri — not the gutwellapp://reset-password form
# people usually write by hand. Listing both, plus a wildcard, means the
# allow-list matches whichever the runtime actually emits.
additional_redirect_urls = [
  "gutwellapp://reset-password",
  "gutwellapp:///reset-password",
  "gutwellapp://**",
  # Local web dev (kept from the previous config).
  "http://127.0.0.1:3000",
  "https://127.0.0.1:3000",
  # Expo Go / dev client on a LAN address — createURL emits exp://<host>/--/<path>
  # there, so the scheme differs from the release build.
  "exp://**",
]

jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Kept false to match the project's current hosted setting (mailer_autoconfirm
# is true). Revisit once custom SMTP is live and outbound mail is proven —
# turning confirmations on before then would lock new users out.
enable_confirmations = false

# ── Custom SMTP ─────────────────────────────────────────────────────────────
# Sending architecture: authentication mail is sent from the ROOT domain.
# The Resend Free plan verifies one domain, and the root is the one that gives
# the From address users recognise on a security email.
#
#   sender          auth@getgutwell.app
#   human contact   support@ / hello@ / legal@ @getgutwell.app  (IONOS, root MX)
#
# Inbound mail is unaffected. Resend puts its bounce MX and SPF under
# send.getgutwell.app, and MX records only apply to the subdomain they sit on,
# so the root MX (IONOS) and the root SPF are never modified.
#
# Accepted trade-off: sending reputation now attaches to the root domain, which
# also carries the human mailboxes and the brand. The mitigation is discipline —
# the root sends TRANSACTIONAL AUTH MAIL ONLY. Never send marketing or bulk from
# it; if that day comes, upgrade the plan and move bulk to its own subdomain.
#
# See EMAIL_ARCHITECTURE.md for the full rationale and the DNS records.
#
# ┌────────────────────────────────────────────────────────────────────────┐
# │  DO NOT RUN `supabase config push`                                     │
# └────────────────────────────────────────────────────────────────────────┘
#
# As of 6 August 2026 custom SMTP is CONFIGURED AND LIVE on the hosted project,
# set through the Dashboard. Password recovery has been verified end to end on a
# physical iPhone.
#
# The block below is STILL COMMENTED OUT. That means the local config no longer
# matches the hosted config, and `supabase config push` would push this file's
# empty SMTP section over the live one — disabling custom SMTP and silently
# breaking password recovery for every user. The failure is invisible until a
# user tries to reset a password.
#
# Live values (the password lives only in the Dashboard, never here):
#   host smtp.resend.com : 465 · user resend
#   sender auth@getgutwell.app / GutWell AI
#
# If you ever DO need to manage this from the repo: uncomment the block, export
# SMTP_PASSWORD (the Resend API key) in the shell, then push. pass uses env() so
# no secret is written to this file or committed. Re-verify recovery afterwards.
#
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 465                      # implicit TLS; use 587 (STARTTLS) if 465 is blocked
# user = "resend"                 # literal string "resend" — not an email address
# pass = "env(SMTP_PASSWORD)"
# admin_email = "auth@getgutwell.app"
# sender_name = "GutWell AI"

# ── Recovery email template ─────────────────────────────────────────────────
# Uncomment to manage the template in-repo rather than in the Dashboard.
# The file already exists at supabase/templates/recovery.html.
#
# [auth.email.template.recovery]
# subject = "Reset your GutWell AI password"
# content_path = "./templates/recovery.html"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.waitlist-signup]
verify_jwt = false
