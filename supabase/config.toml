[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://getgutwell.app"

# Password recovery returns the user to the app through the custom scheme
# registered in app.json and ios/GutWell/Info.plist (CFBundleURLSchemes).
#
# Both slash forms are listed deliberately. The app builds the redirect with
# expo-linking's Linking.createURL('/reset-password'). In a release build that
# resolves to gutwellapp:///reset-password (three slashes) — createURL appends a
# leading slash to an empty hostUri — not the gutwellapp://reset-password form
# people usually write by hand. Listing both, plus a wildcard, means the
# allow-list matches whichever the runtime actually emits.
additional_redirect_urls = [
  "gutwellapp://reset-password",
  "gutwellapp:///reset-password",
  "gutwellapp://**",
  # Local web dev (kept from the previous config).
  "http://127.0.0.1:3000",
  "https://127.0.0.1:3000",
  # Expo Go / dev client on a LAN address — createURL emits exp://<host>/--/<path>
  # there, so the scheme differs from the release build.
  "exp://**",
]

jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Kept false to match the project's current hosted setting (mailer_autoconfirm
# is true). Revisit once custom SMTP is live and outbound mail is proven —
# turning confirmations on before then would lock new users out.
enable_confirmations = false

# ── Custom SMTP ─────────────────────────────────────────────────────────────
# Sending architecture (approved): authentication mail is sent from the
# dedicated subdomain mail.getgutwell.app, NOT from the root domain.
#
#   sender          auth@mail.getgutwell.app      machine-sent, send-only
#   human contact   support@ / hello@ / legal@ @getgutwell.app  (IONOS, root MX)
#
# The subdomain isolates sending reputation: if transactional or, later,
# marketing mail is ever flagged, it cannot damage the root domain that carries
# the human mailboxes and the brand. Resend places its bounce MX and SPF under
# send.mail.getgutwell.app, so the root MX and root SPF are never touched and
# inbound mail to the human addresses is unaffected.
#
# See EMAIL_ARCHITECTURE.md for the full rationale and the DNS records.
#
# STILL COMMENTED OUT ON PURPOSE. Enable only after Resend reports
# mail.getgutwell.app as Verified — enabling it earlier points Supabase at an
# unverified sender and every recovery email is rejected.
#
# To enable: uncomment, export SMTP_PASSWORD (the Resend API key) in the shell,
# then run `supabase config push`. pass uses env() so no secret is ever written
# to this file or committed.
#
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 465                      # implicit TLS; use 587 (STARTTLS) if 465 is blocked
# user = "resend"                 # literal string "resend" — not an email address
# pass = "env(SMTP_PASSWORD)"
# admin_email = "auth@mail.getgutwell.app"
# sender_name = "GutWell AI"

# ── Recovery email template ─────────────────────────────────────────────────
# Uncomment to manage the template in-repo rather than in the Dashboard.
# The file already exists at supabase/templates/recovery.html.
#
# [auth.email.template.recovery]
# subject = "Reset your GutWell AI password"
# content_path = "./templates/recovery.html"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.waitlist-signup]
verify_jwt = false
