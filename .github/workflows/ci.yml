name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        # supabase/functions is excluded in tsconfig.json — those files are
        # Deno-typed and compile in the edge runtime, not the app bundle.
        # No output filtering here on purpose: any error tsc reports is a real
        # app error and must fail the build.
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint -- --max-warnings 60

      - name: Tests
        run: npx jest --ci
